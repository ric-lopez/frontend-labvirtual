<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio Virtual</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <div class="navbar-header">
            <a class="navbar-brand" href="/">
                <img alt="Laboratorio Virtual" src="static/img/logoFC_2.png" height="50px">
            </a>
            <h2 class="navbar-text">Laboratorio Virtual</h2>
          </div>
        </div>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-item nav-link" href="/young">Óptica</a>
              <a class="nav-item nav-link" href="/velocidad_inst">Mecánica</a>
              <a class="nav-item nav-link" href="/fotoelectrico">Electromagnetismo</a>
              <a class="nav-item nav-link" href="/tensionsuper">Fenómenos colectivos</a>
              <a class="nav-item nav-link" href="#">Otros</a>
            </div>
          </div>
      </nav>
      <div class="row">
        <div class="col-sm-2 py-3">
          <div class="px-5">
            <h5>ELECTROMAGNETISMO:</h5>
          </div>
          <nav class="nav flex-column">
            <a class="nav-link active" aria-current="page" href="#">Efecto fotoeléctrico</a>
            <!-- <a class="nav-link" href="/velocidad_inst"></a> -->
          </nav>
        </div>
        <div class="col-sm-8">
          <div class="container pt-4">
            <div class="d-flex justify-content-center">
              <h2>Efecto fotoeléctrico</h2>
            </div>
            <br>
            <div class="row">
              <div class="col-sm">
            Sistema de desplazamiento
            <br></br>
            <form>
                <div class="form-group row">
                    <label for="desplazamiento" class="col-sm-2 col-form-label">Desplazamiento</label>
                    <div class="col-sm-9">
                      <input type="number" class="form-control" id="desplazamiento" placeholder="Desplazamiento en centímetros">
                    </div>
                    <div class="col-sm-1">
                      <h6>[cm]</h6>
                    </div>
                  </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
            <div class="container">
                
            </div>
            <div class="container d-flex justify-content-center">
                <div class="row">
                    <div class="col">
                        <div class="row">
                            <div class="col-sm-12 d-flex justify-content-center">
                                <p>Led</p>
                            </div>
                            <div class="col-sm-12 d-flex justify-content-center">
                                <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                    <label class="btn btn-primary">
                                    <input type="radio" name="options" id="option1" autocomplete="off" checked> UV
                                    </label>
                                    <label class="btn btn-primary">
                                    <input type="radio" name="options" id="option2" autocomplete="off"> AZ
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="row">
                            <div class="col-sm-12 d-flex justify-content-center">
                                <p>Posición: 
                                    <span id="curr"></span>
                                </p>
                            </div>
                            <div class="col-sm-12 d-flex justify-content-center">
                                <input id="myRange" 
                                    min="0" 
                                    max="7" 
                                    step="1" 
                                    type="range" 
                                    class="form-range" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          </div>
          </div>
        </div>
        <hr>
        <div class="container">
            <div class="d-flex justify-content-center">
                <h1>Resultados</h1>
            </div>
            
            <div class="row">
                <div class="col-sm">
                    <p>Transmisión de video</p>
                    <div class="embed-responsive embed-responsive-4by3">
                        <iframe class="embed-responsive-item" src="/static/img/fotoelectrico/no-signal.jpeg"></iframe>
                      </div>
                </div>
                <div class="col-sm">
                    <div class="row">
                        <div class="col-sm-12 py-5">
                            <p class="text-justify">
                                Posición: <br>
                                Voltaje: [V]<br>
                                Corriente: [mAh]<br>
                                Led activo: <br>
                            </p>
                        </div>
                        <!-- <div class="col-sm-12 d-flex justify-content-center">
                            <button type="button" class="btn btn-primary">Guardar imagen</button>
                        </div> -->
                    </div>
                    <br>
                </div>    
            </div>
        </div>
      </div>
    <script>
        var el = document.getElementById('curr');
        var r = document.getElementById('myRange');
        el.innerText = r.valueAsNumber;
        r.addEventListener('change', () => {
            el.innerText = r.valueAsNumber;
        })
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
